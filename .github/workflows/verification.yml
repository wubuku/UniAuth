name: Verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20.19'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            python-resource-server/requirements.lock
            python-resource-server/requirements-tools.lock

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm ci --registry=https://registry.npmjs.org/
          npx playwright install --with-deps chrome

      - name: Run complete verification gate
        env:
          TESTCONTAINERS_RYUK_DISABLED: 'true'
          VERIFICATION_ARTIFACTS_DIR: ${{ runner.temp }}/uniauth-verification-artifacts
        run: scripts/verify.sh

      - name: Upload verification artifacts on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verification-failure-artifacts
          path: ${{ runner.temp }}/uniauth-verification-artifacts
          if-no-files-found: warn
