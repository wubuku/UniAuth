name: Mutation probe

# Low-frequency assertion-strength probe. It is deliberately separate from
# verification.yml: the main gate must not pay for PIT, and a probe failure
# never changes the required PR/push semantics. PIT runs on JDK 21 because the
# local default JDK (25+) makes PIT reject class file major version 69.
on:
  schedule:
    # Every Thursday at 04:00 UTC (12:00 Asia/Shanghai).
    - cron: '0 4 * * 4'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-probe
  cancel-in-progress: false

jobs:
  scoped-pit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run scoped mutation probe
        run: |
          mvn -Pmutation-testing test-compile \
            org.pitest:pitest-maven:mutationCoverage

      - name: Compare against mutation baseline
        run: python3 scripts/check-mutation-baseline.py

      - name: Upload PIT reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-probe-${{ github.run_id }}
          path: target/pit-reports
          if-no-files-found: warn
          retention-days: 30

      - name: Run email service scoped mutation probe
        run: |
          cd reference/email-service
          mvn -Pmutation-testing test-compile \
            org.pitest:pitest-maven:mutationCoverage

      - name: Compare email service mutation baseline
        run: python3 reference/email-service/scripts/check-mutation-baseline.py

      - name: Upload email service PIT reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: email-mutation-probe-${{ github.run_id }}
          path: reference/email-service/target/pit-reports
          if-no-files-found: warn
          retention-days: 30
