server:
  address: ${EMAIL_SERVICE_BIND_ADDRESS:127.0.0.1}
  port: ${EMAIL_SERVICE_PORT:8095}

spring:
  application:
    name: email-service-reference

  datasource:
    url: jdbc:postgresql://${EMAIL_POSTGRES_HOST}:${EMAIL_POSTGRES_PORT:5432}/${EMAIL_POSTGRES_DATABASE}
    username: ${EMAIL_POSTGRES_USER}
    password: ${EMAIL_POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration/postgresql
    table: email_service_flyway_schema_history
    default-schema: public
    schemas: public
    baseline-on-migrate: false
    clean-disabled: true
    validate-on-migrate: true
    out-of-order: false

  sql:
    init:
      mode: never

  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT}
    username: ${SMTP_USERNAME:${SPRING_MAIL_USERNAME:}}
    password: ${SMTP_PASSWORD:${SPRING_MAIL_PASSWORD:}}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          connectiontimeout: ${SMTP_CONNECTION_TIMEOUT_MS:10000}
          timeout: ${SMTP_READ_TIMEOUT_MS:10000}
          writetimeout: ${SMTP_WRITE_TIMEOUT_MS:10000}
          starttls:
            enable: ${SMTP_STARTTLS_ENABLE:true}
            required: ${SMTP_STARTTLS_REQUIRED:true}
          ssl:
            enable: ${SMTP_SSL_ENABLE:false}

app:
  security:
    api-key: ${EMAIL_SERVICE_API_KEY:}
  mail:
    from-email: ${EMAIL_FROM_ADDRESS:${APP_MAIL_FROM_EMAIL}}
    from-name: ${EMAIL_FROM_NAME:UniAuth}
    enabled: true
    queue:
      enabled: true
      event-driven: ${EMAIL_QUEUE_EVENT_DRIVEN:true}
    retry:
      max-attempts: ${EMAIL_MAX_RETRY_ATTEMPTS:3}
      delay-minutes: ${EMAIL_RETRY_DELAY_MINUTES:10}
    rate-limit:
      enabled: ${EMAIL_RATE_LIMIT_ENABLED:true}
      max-per-minute: ${EMAIL_RATE_LIMIT_PER_MINUTE:60}
    recovery:
      enabled: ${EMAIL_RECOVERY_ENABLED:true}
      scan-interval-minutes: ${EMAIL_RECOVERY_SCAN_INTERVAL_MINUTES:5}
      stuck-timeout-minutes: ${EMAIL_STUCK_TIMEOUT_MINUTES:10}

logging:
  level:
    org.dddml.email: INFO
