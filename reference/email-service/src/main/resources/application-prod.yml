spring:
  config:
    activate:
      on-profile: prod
  jpa:
    hibernate:
      ddl-auto: validate

app:
  mail:
    rate-limit:
      max-per-minute: ${EMAIL_RATE_LIMIT_PER_MINUTE:100}
    recovery:
      scan-interval-minutes: ${EMAIL_RECOVERY_SCAN_INTERVAL_MINUTES:10}

logging:
  level:
    org.dddml.email: INFO
