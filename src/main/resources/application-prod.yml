# Production Environment Configuration
# 使用PostgreSQL数据库用于生产环境

server:
  forward-headers-strategy: none
  max-http-request-header-size: 16KB
  tomcat:
    max-http-form-post-size: 1MB
    max-swallow-size: 1MB
  servlet:
    session:
      cookie:
        name: __Host-JSESSIONID
        secure: true

app:
  auth:
    cookie:
      secure: true
      access-token-name: __Host-accessToken
      refresh-token-name: __Host-refreshToken
    transport:
      expose-access-token: false
      diagnostics-enabled: false
    rate-limit:
      enabled: true
      key-secret: ${AUTH_RATE_LIMIT_KEY_SECRET}
    introspection:
      client-id: ${INTROSPECTION_CLIENT_ID}
      client-secret: ${INTROSPECTION_CLIENT_SECRET}
  frontend:
    url: ${APP_FRONTEND_URL}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  email:
    service:
      url: ${EMAIL_SERVICE_URL}
      api-key: ${EMAIL_SERVICE_API_KEY}
    verification:
      hmac-key: ${EMAIL_VERIFICATION_HMAC_KEY}
      hmac-key-id: ${EMAIL_VERIFICATION_HMAC_KEY_ID}
  web3:
    domain: ${WEB3_DOMAIN}

jwt:
  rsa:
    key-file: ${JWT_RSA_KEY_FILE}
    generate-if-missing: false
  token:
    issuer: ${JWT_ISSUER}
    audience: ${JWT_AUDIENCE}
    kid: ${JWT_KID}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DATABASE}
    driver-class-name: org.postgresql.Driver
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate  # 生产环境不自动修改表，只验证
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          batch_size: 50
          fetch_size: 50
        order_inserts: true
        order_updates: true

  sql:
    init:
      mode: never  # 生产环境不自动执行初始化脚本

  # Spring Session JDBC 配置；表结构由 Flyway migration 管理。
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never
    timeout: 1800

logging:
  level:
    com.example.oauth2demo: WARN
    org.springframework.security: WARN
    org.springframework.web: WARN
    root: WARN
