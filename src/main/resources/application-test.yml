# Test Environment Configuration
# 使用PostgreSQL数据库进行集成测试

spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DATABASE}
    driver-class-name: org.postgresql.Driver
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update  # 由schema-postgresql.sql处理
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20

  sql:
    init:
      mode: always  # 总是执行初始化脚本
      schema-locations: classpath:schema-postgresql.sql
      # 演示数据默认关闭；仅在 disposable 数据库上显式启用。

  # Spring Session JDBC 配置 - 在 test 环境使用 PostgreSQL 持久化
  # 演示多个 test 实例共享同一个 session 存储
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: always
    timeout: 1800

  security:
    oauth2:
      client:
        registration:
          google:
            # redirect-uri: http://localhost:5173/oauth2/callback
            redirect-uri: https://blacksheepmedia.xyz/oauth2/callback
          github:
            #redirect-uri: http://localhost:5173/oauth2/callback
            redirect-uri: https://api.u2511175.nyat.app:55139/oauth2/callback
          x:  # ✅ X API v2：提供者名改为 'x'
            redirect-uri: https://blacksheepmedia.xyz/oauth2/callback
            # redirect-uri: http://localhost:5173/oauth2/callback
            # redirect-uri: https://api.u2511175.nyat.app:55139/oauth2/callback

logging:
  level:
    org.dddml.uniauth: INFO
    org.springframework.security: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: INFO

app:
  web3:
    nonce-expiration-seconds: 300
    domain: api.u2511175.nyat.app
