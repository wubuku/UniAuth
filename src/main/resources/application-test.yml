# Test Environment Configuration
# 使用PostgreSQL数据库进行集成测试

spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DATABASE}
    driver-class-name: org.postgresql.Driver
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20

  sql:
    init:
      mode: never

  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never
    timeout: 1800

  security:
    oauth2:
      client:
        registration:
          google:
            redirect-uri: ${OAUTH2_CALLBACK_URI:http://localhost:8081/oauth2/callback}
          github:
            redirect-uri: ${OAUTH2_CALLBACK_URI:http://localhost:8081/oauth2/callback}
          x:  # ✅ X API v2：提供者名改为 'x'
            redirect-uri: ${OAUTH2_CALLBACK_URI:http://localhost:8081/oauth2/callback}

logging:
  level:
    org.dddml.uniauth: INFO
    org.springframework.security: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: INFO

app:
  frontend:
    url: ${APP_FRONTEND_URL:http://localhost:5173}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  web3:
    nonce-expiration-seconds: 300
    domain: api.u2511175.nyat.app
