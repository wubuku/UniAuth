server:
  port: 8081  # 隧道暴露端口

app:
  demo-data:
    enabled: false
    disposable: false
  frontend:
    type: react  # 可选值: thymeleaf（传统模板）, react（现代SPA）
    url: https://blacksheepmedia.xyz  # 前端地址，用于OAuth2回调重定向
  email:
    service:
      url: ${EMAIL_SERVICE_URL:http://localhost:8095}
      timeout: 5000
    verification:
      code-length: 6
      expiry-minutes: 10
      max-send-per-day: 10
      max-retry-attempts: 5
      resend-cooldown-seconds: 60
    registration:
      require-email-username: false
  jwt:
    # JWT密钥配置
    # 优先级: 配置项 > 环境变量(JWT_SECRET) > 配置的密钥文件 > 默认文件(jwt-secret.key) > 默认密钥(仅开发环境)
    secret: ""  # 直接配置JWT密钥，生产环境推荐使用环境变量
    secret-file: ""  # 配置密钥文件路径
  web3:
    nonce-expiration-seconds: 300  # Nonce有效期（秒）
    domain: blacksheepmedia.xyz  # 域名，用于SIWE消息
    # SIWE 签名消息模板
    # 参数说明:
    # %1$s: Domain (域名)
    # %2$s: Wallet Address (钱包地址)
    # %3$s: URI (完整URI，包含协议)
    # %4$s: Nonce (随机数)
    # %5$s: Issued At (签发时间)
    # %6$s: Expiration Time (过期时间)
    message-format: |
      %1$s wants you to sign in with your Ethereum account:
      %2$s

      By signing, you agree to authenticate with your wallet.

      URI: %3$s
      Version: 1
      Chain ID: 1
      Nonce: %4$s
      Issued At: %5$s
      Expiration Time: %6$s
  cors:
    allowed-origins:
      - https://api.u2511175.nyat.app:55139
      - http://localhost:5173
      - http://localhost:8081
      - https://blacksheepmedia.xyz
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    allowed-headers:
      - "*"
    exposed-headers:
      - Authorization
    allow-credentials: true
    max-age: 3600

# JWT配置
jwt:
  # RSA密钥配置
  rsa:
    key-file: ${JWT_RSA_KEY_FILE:.local/uniauth/rsa-keys.ser}
  # Token过期时间配置（毫秒）
  expires:
    access-token: 3600000  # 1小时
    refresh-token: 604800000  # 7天
  # 令牌配置
  token:
    issuer: https://auth.example.com
    audience: resource-server
    kid: key-1

spring:
  application:
    name: uni-auth

  # 启动时必须显式选择 dev、test 或 prod profile。
  # 仓库默认配置不连接任何数据库。

  # 数据库连接由 application-{profile}.yml 接管；所有受支持 profile 都使用 PostgreSQL。

  flyway:
    enabled: true
    locations: classpath:db/migration/postgresql
    table: uniauth_flyway_schema_history
    default-schema: public
    schemas: public
    baseline-on-migrate: false
    clean-disabled: true
    validate-on-migrate: true
    out-of-order: false

  jpa:
    # JPA配置由环境特定的配置文件提供

  # Spring Session JDBC 配置 - Session 持久化到数据库
  session:
    store-type: jdbc                # 使用 JDBC 存储 session（而不是内存）
    jdbc:
      initialize-schema: never      # Spring Session 表由 Flyway 管理
    timeout: 1800                   # Session 超时时间：30分钟（单位：秒）
    cookie:
      name: JSESSIONID              # Session Cookie 名称
      http-only: true               # HttpOnly，防止 XSS 攻击
      path: /                        # Cookie 路径
      same-site: Lax                # SameSite 属性，防止 CSRF 攻击

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
            redirect-uri: https://blacksheepmedia.xyz/oauth2/callback
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope:
              - user:email
              - read:user
            redirect-uri: https://blacksheepmedia.xyz/oauth2/callback
          x:  # ✅ X API v2：提供者名改为 'x'
            client-id: ${TWITTER_CLIENT_ID}
            client-secret: ${TWITTER_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            scope:
              - tweet.read
              - users.read
              - follows.read
              - like.read
              - offline.access
            redirect-uri: https://blacksheepmedia.xyz/oauth2/callback
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth?prompt=select_account
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://openidconnect.googleapis.com/v1/userinfo
            user-name-attribute: sub
            jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
          github:
            authorization-uri: https://github.com/login/oauth/authorize?prompt=consent
            token-uri: https://github.com/login/oauth/access_token
            user-info-uri: https://api.github.com/user
            user-name-attribute: login
          x:  # ✅ X API v2：提供者名改为 'x'
            authorization-uri: https://x.com/i/oauth2/authorize
            token-uri: https://api.x.com/2/oauth2/token
            user-info-uri: https://api.x.com/2/users/me
            user-name-attribute: data.username  # ✅ 响应格式改变：包装在data字段中
            jwk-set-uri: https://x.com/i/oauth2/jwks

  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html

  web:
    resources:
      static-locations: classpath:/static/, classpath:/public/, classpath:/resources/, classpath:/META-INF/resources/
      cache:
        period: 0  # 开发环境禁用缓存
      # 静态资源服务配置会根据app.frontend.type动态决定

logging:
  level:
    org.dddml.uniauth: INFO
    org.springframework.security: INFO
    org.springframework.web: INFO
    org.springframework.security.oauth2: INFO
    org.springframework.session: INFO
    org.springframework.session.jdbc.JdbcOperationsSessionRepository: INFO
